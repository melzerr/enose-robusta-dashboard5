[package]
name = "enose-backend"
version = "0.1.0"
edition = "2021"
default-run = "enose-backend"
description = "Electronic Nose Robusta Coffee Quality Monitoring Backend"
authors = ["Electronic Nose Team"]

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web Server & WebSocket (Axum)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Serial Port (USB UART)
tokio-serial = "5.4"

# MQTT Client (Rumqttc)
rumqttc = { version = "0.24", features = ["use-rustls"] }
rand = "0.10.2"
chrono = "0.4.45"
dotenvy = "0.15.7"
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
urlencoding = "2.1.3"
# HTTP Client for Azure REST API / C2D
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }

# Future Expansion: Local Database (SQLite / Postgres)
# sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
